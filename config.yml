params:
  env: production
  author: Janik Besendorf
  mainSections:
  - posts
  images:
  - /images/avatar.jpg
  defaultTheme: dark
  disableThemeToggle: false
  ShowReadingTime: true
  ShowWordCount: true
  ShowShareButtons: true
  ShareButtons:
  - linkedin
  - x
  - reddit
  ShowPostNavLinks: false
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  showtoc: false
  comments: false
  assets:
    favicon: /favicon.ico
    favicon16x16: /favicon-16x16.png
    favicon32x32: /favicon-32x32.png
    apple_touch_icon: /apple-touch-icon.png
    safari_pinned_tab: /safari-pinned-tab.svg
  label:
    text: Janik Besendorf
  profileMode:
    enabled: true
    title: Janik Besendorf
    imageUrl: /images/avatar.jpg
    imageWidth: 120
    imageHeight: 120
  socialIcons:
  - name: twitter
    url: https://twitter.com/jbesendorf
  - name: mastodon
    url: https://chaos.social/@besendorf
  - name: github
    url: https://github.com/besendorf
  - name: LinkedIn
    url: https://linkedin.com/in/janik-besendorf
  - name: matrix
    url: https://matrix.to/#/@besendorf:systemli.org
  editPost:
    URL: https://github.com/besendorf/besendorf.github.io/edit/main/content
    appendFilePath: true
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    ignoreLocation: true
    threshold: 0.3
    minMatchCharLength: 2
    keys:
    - title
    - summary
    - content
markup:
  highlight:
    noClasses: false
    guessSyntax: true
    lineNos: true
    style: monokai
outputs:
  home:
  - HTML
  - RSS
  - JSON
privacy:
  disqus:
    disable: true
  googleAnalytics:
    disable: true
  instagram:
    disable: true
  x:
    disable: true
  vimeo:
    disable: true
  youtube:
    disable: true
