{{- $image := index site.Params.images 0 -}}
{{- with .Params.images -}}{{- $image = index . 0 -}}{{- end -}}
{{- with .Params.cover.image -}}
  {{- $image = . -}}

{{- end -}}
{{- return ($image | absURL) -}}
