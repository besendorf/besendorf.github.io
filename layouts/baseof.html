{{- if lt hugo.Version "0.158.0" }}
{{- errorf "=> hugo v0.158.0 or greater is required for hugo-WonderMod to build " }}
{{- end -}}

<!DOCTYPE html>
<html lang="{{ .Language.Locale }}" dir="{{ .Language.Direction | default "auto" }}">

<head>
    {{- partial "head.html" . }}
</head>

<body class="
{{- if (or (ne .Kind `page` ) (eq .Layout `archives`) (eq .Layout `search`)) -}}
{{- print "list" -}}
{{- end -}}
{{- if eq site.Params.defaultTheme `dark` -}}
{{- print " dark" }}
{{- end -}}
" id="top">
    {{- partialCached "header.html" . .Page -}}
    <a class="skip-link" href="#main-content">{{ i18n "skip_content" }}</a>
    <main class="main" id="main-content" tabindex="-1">
        {{- block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . -}}
</body>

</html>
