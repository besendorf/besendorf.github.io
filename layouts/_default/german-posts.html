{{ define "main" }}
<header class="page-header"><h1>{{ .Title }}</h1></header>
<div class="post-content">{{ .Content }}</div>
{{ range hugo.Sites }}
  {{ if eq .Language.Lang "de" }}
    {{ range where .RegularPages "Type" "posts" }}
      <article class="post-entry">
        <header class="entry-header"><h2><a href="{{ .RelPermalink }}" lang="de" hreflang="de-DE">{{ .Title }}</a></h2></header>
        <p class="entry-footer">{{ .Date.Format "2006-01-02" }} · German</p>
      </article>
    {{ end }}
  {{ end }}
{{ end }}
{{ end }}
